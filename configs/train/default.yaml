# batch_size=256 (not 64): these models are tiny (7-14k params), so on a GPU
# a small batch spends most of its wall-clock time on Python/kernel-launch
# overhead rather than compute -- observed as low (~10%) GPU utilization on
# SERVER-02. A bigger batch does more work per launch. See
# docs/SERVER_INVENTORY.md "GPU utilization" for the full explanation and
# what else affects it (DataLoader num_workers, which is set per-profile in
# configs/profile/*.yaml and threaded through by scripts/train.py).
# epochs/early_stopping_patience raised (30/8 -> 60/15) after the first
# real-data G1a run: per-fold validation sets are tiny (often just 1-2 EDFs,
# sometimes a single seizure event), so val_loss is noisy and early stopping
# was firing around epoch 11-18 -- before the model had much chance to
# improve past a val set that small. More patience gives it room; more
# epochs gives it something to use that room for. Segment-level AUROC was
# already 0.92-0.94 with the old settings, so this is about calibration/
# confidence on hard examples, not fixing a fundamentally broken model.
epochs: 60
batch_size: 256
lr: 0.001
weight_decay: 0.0001
optimizer: adamw
seeds: [0, 1, 2]     # memo 5.3: three random seeds for training
early_stopping_patience: 15
class_balanced_sampling: true   # train partition only
max_folds: null      # set via CLI (train.max_folds=2) to smoke-test on a few folds before a full run
force_retrain: false  # true re-trains folds that already have a metrics.json (default: resume/skip them)

# Lever L1 (docs/RESEARCH_REALITY_CHECK.md section 14): cohort pre-training.
# Without it, every fold trains a ~12k-parameter CNN from random init on ONE
# patient's EDFs -- for chb17 (3 seizures, one held out per fold) that is two
# seizures of ictal data. With it, each fold starts from a model pre-trained on
# every OTHER patient (leakage-safe: the target patient contributes nothing to
# its own init) and only fine-tunes on that patient's data.
#
# Default OFF so every number in docs/EXPERIMENT_LOG_G1a.md stays reproducible.
# Turn on with: train.pretrain.enabled=true
#
# The init depends only on WHICH patient is held out, not on which of their
# EDFs is the test file, so 66 folds need 13 pre-trainings; they are cached
# under ${profile.artifacts_dir}/pretrain/${model.name}/${window.name}/ and
# reused (set train.pretrain.force=true to rebuild them).
pretrain:
  enabled: false
  # NOT 60. The 60/15 setting above was raised specifically because a per-fold
  # val set is "often just 1-2 EDFs, sometimes a single seizure event" -- that
  # reasoning does not transfer here. A pre-training epoch covers ~12/13 of the
  # corpus (~553h => ~2.0M windows at 4s/1s), so one epoch here sees far more
  # gradient steps than one per-patient epoch, and the val set spans whole
  # subjects rather than a single event. Start at 20 and raise only if
  # best_val_loss in the sidecar JSON is still improving when it stops.
  epochs: 20
  lr: 0.001
  early_stopping_patience: 5
  # Left at the fine-tuning batch size on purpose. Raising it is NOT a free
  # throughput knob: it changes optimisation semantics and would need the LR
  # retuned, while buying little here (per-iteration time is kernel-launch
  # bound, not compute bound). To use an idle machine, run
  # scripts/pretrain_cohort.py in concurrent shards instead.
  batch_size: 256
  val_subject_fraction: 0.2   # subject-level val split inside the pre-training cohort
  force: false

# Fine-tuning LR, used ONLY when pretrain.enabled. Lower than `lr` because the
# model starts from a trained cohort model rather than random weights; a full
# 1e-3 step would wash the pre-training out on a patient with 2-3 seizures.
finetune_lr: 0.0001
