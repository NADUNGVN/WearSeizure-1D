# batch_size=256 (not 64): these models are tiny (7-14k params), so on a GPU
# a small batch spends most of its wall-clock time on Python/kernel-launch
# overhead rather than compute -- observed as low (~10%) GPU utilization on
# SERVER-02. A bigger batch does more work per launch. See
# docs/SERVER_INVENTORY.md "GPU utilization" for the full explanation and
# what else affects it (DataLoader num_workers, which is set per-profile in
# configs/profile/*.yaml and threaded through by scripts/train.py).
# epochs/early_stopping_patience raised (30/8 -> 60/15) after the first
# real-data G1a run: per-fold validation sets are tiny (often just 1-2 EDFs,
# sometimes a single seizure event), so val_loss is noisy and early stopping
# was firing around epoch 11-18 -- before the model had much chance to
# improve past a val set that small. More patience gives it room; more
# epochs gives it something to use that room for. Segment-level AUROC was
# already 0.92-0.94 with the old settings, so this is about calibration/
# confidence on hard examples, not fixing a fundamentally broken model.
epochs: 60
batch_size: 256
lr: 0.001
weight_decay: 0.0001
optimizer: adamw
# Lever L7. This key existed from the first commit (memo 5.3 asks for three
# random seeds) but nothing read it -- scripts/train.py only ever used
# `cfg.seed` -- so not one of the 26 runs in docs/EXPERIMENT_LOG_G1a.md has an
# error bar. It is wired up now (utils/paths.seeds_from_cfg).
#
# Default stays null = "just cfg.seed", because turning three seeds on by
# default would silently triple every run and change every recorded number.
# Ask for error bars explicitly:  train.seeds=[0,1,2]
# Each seed trains into its own `<window>/seed<N>/` directory and
# scripts/evaluate.py aggregates them as mean +/- std.
seeds: null
early_stopping_patience: 15
class_balanced_sampling: true   # train partition only
max_folds: null      # set via CLI (train.max_folds=2) to smoke-test on a few folds before a full run
force_retrain: false  # true re-trains folds that already have a metrics.json (default: resume/skip them)

# Lever L1 (docs/RESEARCH_REALITY_CHECK.md section 14): cohort pre-training.
# Without it, every fold trains a ~12k-parameter CNN from random init on ONE
# patient's EDFs -- for chb17 (3 seizures, one held out per fold) that is two
# seizures of ictal data. With it, each fold starts from a model pre-trained on
# every OTHER patient (leakage-safe: the target patient contributes nothing to
# its own init) and only fine-tunes on that patient's data.
#
# Default OFF so every number in docs/EXPERIMENT_LOG_G1a.md stays reproducible.
# Turn on with: train.pretrain.enabled=true
#
# The init depends only on WHICH patient is held out, not on which of their
# EDFs is the test file, so 66 folds need 13 pre-trainings; they are cached
# under ${profile.artifacts_dir}/pretrain/${model.name}/${window.name}/ and
# reused (set train.pretrain.force=true to rebuild them).
pretrain:
  enabled: false
  # NOT 60. The 60/15 setting above was raised specifically because a per-fold
  # val set is "often just 1-2 EDFs, sometimes a single seizure event" -- that
  # reasoning does not transfer here. A pre-training epoch covers ~12/13 of the
  # corpus (~553h => ~2.0M windows at 4s/1s), so one epoch here sees far more
  # gradient steps than one per-patient epoch, and the val set spans whole
  # subjects rather than a single event. Start at 20 and raise only if
  # best_val_loss in the sidecar JSON is still improving when it stops.
  epochs: 20
  lr: 0.001
  early_stopping_patience: 5
  # Left at the fine-tuning batch size on purpose. Raising it is NOT a free
  # throughput knob: it changes optimisation semantics and would need the LR
  # retuned, while buying little here (per-iteration time is kernel-launch
  # bound, not compute bound). To use an idle machine, run
  # scripts/pretrain_cohort.py in concurrent shards instead.
  batch_size: 256
  val_subject_fraction: 0.2   # subject-level val split inside the pre-training cohort
  force: false
  # Reuse the untagged (control) pre-training cache instead of one keyed by
  # train.run_tag. Correct ONLY for levers that leave pre-training untouched:
  # L3 changes the fine-tuning loss alone, so tagging its cache would spend
  # about forty hours reproducing weights already on disk. L4, which DOES change
  # how pre-training selects checkpoints, correctly rebuilt its own -- setting
  # this there would have silently reused the control initialisations and the
  # experiment would have measured nothing while looking like it ran.
  share_cache_with_control: false
  # Lever L5. false = pre-train on the other 12 evaluation cases only (what
  # rows 21-26 did). true = also draw on the CHB-MIT cases the protocol does
  # NOT evaluate on, read from `data.pretrain_manifest_path`.
  #
  # Evaluation is untouched either way: the wider corpus is only ever a
  # pre-training pool, `data/splits.py` never sees it, and
  # `cohort_pretrain_fold` still refuses if any recording of the held-out
  # person reaches it -- including chb21, which is chb01 recorded again.
  #
  # Requires `scripts/make_manifest.py profile=server data=chbmit` to have been
  # re-run so the pre-training manifest exists. Changing the corpus invalidates
  # cached inits automatically (they carry the cohort manifest hash).
  use_wider_corpus: false

# Fine-tuning LR, used ONLY when pretrain.enabled. Lower than `lr` because the
# model starts from a trained cohort model rather than random weights; a full
# 1e-3 step would wash the pre-training out on a patient with 2-3 seizures.
finetune_lr: 0.0001

# torch.compile mode, or null to disable. See training/loop.train_classifier.
# The binding constraint on this workload is CUDA kernel-launch overhead, not
# arithmetic: a batch of 256 through a ~12k-parameter model is microseconds of
# compute behind ~100 tiny kernels, which is why GPU-utilisation and
# memory-bandwidth counters stay low however many DataLoader workers run.
# `reduce-overhead` captures the step into CUDA graphs and replays it, which
# targets exactly that. Off by default: verify against an uncompiled run before
# adopting it for anything that feeds the paper.
compile_mode: null

# Distinguishes runs that differ in something the artifact path does not
# otherwise encode. The path is keyed by (model, split, window, seed); the
# pre-training corpus is none of those, so a lever-L5 run would land on top of
# the run it is meant to be compared against. Set `train.run_tag=L5` alongside
# `train.pretrain.use_wider_corpus=true` and it writes to `<window>__L5/` instead.
# Empty leaves every existing path byte-identical.
run_tag: null

# Lever L4: what early stopping and checkpoint selection optimise.
#   val_loss  -- cross-entropy. Default, and what every recorded result used.
#   val_auprc -- area under the precision-recall curve on validation windows.
#
# Ictal windows are ~0.5% of the data, so cross-entropy can fall while the
# model gets no better at the minority class that decides every reported
# number. AUPRC scores the positive class specifically and ignores the
# true-negative mass. It is threshold-free, which matters: selecting on event
# sensitivity/FAR directly would need thresholds that threshold_selection.py
# fits on this same validation partition afterwards -- circular.
model_selection: val_loss

# Lever L3: distil a multi-channel teacher into the single-channel student.
#
# Lever L5 established that the missing information cannot be bought with more
# pre-training data -- widening the corpus changed nothing at four electrode
# positions and made things significantly worse at one. This goes the other way
# and extracts more from the recordings already in hand: a teacher reading every
# channel of the same EDFs solves a materially easier problem, and its soft
# probabilities carry what the hard label does not.
#
# Off by default, so every recorded number stays reproducible. Needs real EDFs
# (data=chbmit): the synthetic generator produces one channel per record.
#
# Teachers are cached by FOLD under ${artifacts}/teacher/, not by seed -- the
# teacher does not depend on the student seed, and identical soft targets across
# seeds are what let a seed-to-seed comparison isolate the student.
distill:
  enabled: false
  # Weight on the soft-target term; the hard cross-entropy keeps (1 - alpha).
  alpha: 0.5
  # Softmax temperature. The loss carries the T**2 factor from the original
  # formulation, so the hard/soft balance does not silently depend on this.
  temperature: 2.0
  teacher_epochs: 30
  teacher_lr: 0.001
  teacher_patience: 8
  force: false
  # Ablation: keep the teacher architecture identical but feed it the
  # student's single channel. The teacher is both wider and multi-channel, so a
  # gain from distillation otherwise confounds "more channels" with "more
  # capacity" -- this isolates the channels. Cached separately from the
  # multi-channel teacher, so the two never overwrite each other.
  single_channel_teacher: false
  # Lever L8: distil a finished SINGLE-channel run instead of a multi-channel
  # teacher. Set to a model name (e.g. baseline_frontiers2d) and the fold's
  # checkpoint from that run becomes the teacher -- it is not retrained, because
  # the number worth distilling (0.9726) depends on cohort pre-training that the
  # saved checkpoints already carry. null keeps the L3 behaviour.
  teacher_model: null
  # Which run those checkpoints came from. Empty means the untagged control.
  teacher_run_tag: ""
  # Which seed's teacher to use. null means the student's own seed, which keeps
  # teacher and student paired rather than distilling every seed from one.
  teacher_seed: null
