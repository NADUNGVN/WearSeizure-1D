# Event matching + CI parameters (memo 5.2 / 5.3).
name: event_protocol
match_rule: any_overlap    # an alarm interval matches an event iff they overlap
bootstrap_n: 10000
ci_alpha: 0.05             # 95% CI
min_continuous_test_hours:
  minimum: 100
  target: 150
  stretch: 200

# Which gate table scripts/evaluate.py scores against, relative to the repo
# root (or absolute). null keeps the historical default, configs/eval/gates.yaml.
# Override with: eval.gates_path=configs/eval/gates_v2_proposed.yaml
gates_path: null
