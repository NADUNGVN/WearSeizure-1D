# Ablation variant B (memo 7.2 kernel ablation): drop the k3 branch, keep
# only the dilated k5 branch (dilation 1/2/4 across B2/B3/B4, same as the
# default) -- tests whether the wider dilated receptive field alone explains
# any benefit over the multi-scale design, without the k3 branch's local detail.
name: wearseizure1d_k5only
in_channels: 1
input_len: 1024
stem_out_channels: 8
stage_out_channels: [16, 24, 32, 48]
context_channels: 64
kernels: [5]
dilations: [1, 2, 4]
kernel_mode: k5_only
num_classes: 2
param_budget_max: 32000
mac_budget_max: 2000000
