# Full postprocessor (memo 4.5 / 5.1 step 3): EMA + two-threshold hysteresis +
# run-length + event merge. threshold_on/threshold_off are NEVER set here --
# they are selected only on validation data by
# `training.threshold_selection.fit_threshold_on_val` and frozen to
# `frozen_params_dir` before any continuous test run. This file only defines
# the method, the fixed (non-tuned) parameters, and the search grid.
name: hysteresis_runlength
method: hysteresis_runlength
ema_alpha: 0.125
run_length: 3
event_merge_gap_s: 2.0
# Widened downward (was on_grid floor 0.50) after the first real-data
# baseline run: several folds -- especially patients with very few total
# seizures (e.g. chb17, 3 events total => only 1 val seizure per fold) --
# never crossed 0.50 on validation even with a high AUROC (0.88-0.92),
# because a class-imbalanced 2-way softmax tends to output compressed,
# under-calibrated probabilities for the minority class. Rank-based
# separation (AUROC) being good doesn't mean the raw scores clear a fixed
# absolute threshold; the search needs low options to find where they land.
threshold_search:
  on_grid: [0.20, 0.25, 0.30, 0.35, 0.40, 0.45, 0.50, 0.55, 0.60, 0.65, 0.70, 0.75, 0.80]
  off_grid: [0.10, 0.15, 0.20, 0.25, 0.30, 0.35, 0.40, 0.45, 0.50]
# Constrained selection (memo Table 6 treats sensitivity/FAR as separate
# gates, not one blended score): among combos with validation FAR <= this
# cap, pick the highest-sensitivity one; falls back to min-FAR if none
# qualify. Set to the Gate G1a *minimum* FAR (0.30/h) rather than target
# (0.20/h) so the search has room -- tighten to 0.20 once sensitivity is
# closer to its own gate.
far_cap_per_hour: 0.30
frozen_params_dir: ${profile.artifacts_dir}/frozen_postprocess

# Threshold-selection objective (training/threshold_selection.OBJECTIVES):
#   max_sensitivity -- highest sensitivity with val FAR <= far_cap_per_hour
#   min_delay       -- fastest combination that stays under the FAR cap AND
#                      keeps val sensitivity >= sensitivity_floor
# `min_delay` exists because FAR has consistently had several times more
# headroom than the gate needs while detection delay never cleared its own.
objective: max_sensitivity
sensitivity_floor: null
# Alarm timestamp convention (postprocess/hysteresis.ALARM_TIMESTAMP_FRACTIONS).
# window_end is the causal default and reproduces every recorded result.
alarm_timestamp: window_end
