defaults:
  - profile: local_synthetic
  - data: synthetic
  - split: patient_specific_loso_edf
  - model: wearseizure1d
  - window: w4s_stride1s
  - postprocess: hysteresis_runlength
  - precision: fp32
  - train: default
  - eval: event_protocol
  - _self_

seed: 0

hydra:
  run:
    # Host-qualified because SERVER-02/03/04 share ~/Manh over NFS: the
    # timestamp resolves to the second, so two hosts starting a job in the
    # same second would write their .hydra/ and logs into one directory.
    # The phase scripts export WEARSEIZURE_RUN_HOST; anything run by hand
    # falls back to "local", which is fine for a single-host invocation.
    dir: ${profile.artifacts_dir}/runs/${oc.env:WEARSEIZURE_RUN_HOST,local}_${now:%Y-%m-%d_%H-%M-%S}
  job:
    chdir: false
