[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wearseizure"
version = "0.1.0"
description = "Clinically guided single-channel EEG seizure detection with a mixed-precision streaming 1D-CNN accelerator (software pipeline)"
requires-python = ">=3.10"
readme = "README.md"
dependencies = [
    # torch is intentionally NOT listed here: local (CPU) and server (CUDA)
    # need different wheels from different indexes -- install it via
    # environment/requirements-{local,server}.txt before this package.
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.1",
    "scikit-learn>=1.3",
    "pyedflib>=0.1.36",
    "wfdb>=4.1",
    "hydra-core>=1.3",
    "omegaconf>=2.3",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "pre-commit>=3.7",
]
analysis = [
    "matplotlib>=3.8",
    "torchinfo>=1.8",
    "thop>=0.1.1.post2209072238",
    "jupyter>=1.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: slower end-to-end smoke tests (synthetic data, CPU)",
]

[tool.ruff]
line-length = 100
src = ["src", "tests", "scripts"]
